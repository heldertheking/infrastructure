services:
  portainer-server:
    image: portainer/portainer-ce:latest
    container_name: portainer-core
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443" # Main Portainer Web UI (HTTPS)
      - "8000:8000" # Edge agent communication port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PATH_APPDATA}/core/portainer:/data
    restart: unless-stopped
    networks:
      - core-mgmt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer-core.heldertheking.com`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.portainer-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.portainer.middlewares=portainer-headers"

  glances:
    image: nicolargo/glances:latest
    container_name: glances-core
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - core-mgmt

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-core
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - IMAGES=1
      - POST=0
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - core-mgmt

networks:
  core-mgmt:
    name: core-mgmt-network
    driver: bridge