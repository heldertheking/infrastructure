services:
  portainer-server:
    image: portainer/portainer-ee:latest
    container_name: portainer-core
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    ports:
      - "0.0.0.0:9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PATH_APPDATA}/portainer:/data
    networks:
      - core-mgmt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`containers.heldertheking.com`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.portainer-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.portainer.middlewares=portainer-headers"

  glances:
    image: nicolargo/glances:latest
    container_name: glances-core
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-core
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - IMAGES=1
      - EVENTS=1
      - VOLUMES=1
      - POST=0
    networks:
      - core-mgmt

networks:
  core-mgmt:
    name: core-mgmt-network
    driver: bridge