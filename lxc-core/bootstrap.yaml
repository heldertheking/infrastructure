services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}
    networks:
      - core-mgmt

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - IMAGES=1
      - EVENTS=1
      - VOLUMES=1
      - POST=0
    networks:
      - core-mgmt

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${PATH_APPDATA}/beszel/agent:/var/lib/beszel-agent
      - ${BESZEL_SOCKET}:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      HUB_URL: https://monitoring.heldertheking.com
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}

networks:
  core-mgmt:
    name: core-mgmt-network
    driver: bridge