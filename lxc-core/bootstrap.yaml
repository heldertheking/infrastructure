services:
  portainer-server:
    image: portainer/portainer-ce:latest
    container_name: portainer-server
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443" # Main Portainer Web UI (HTTPS)
      - "8000:8000" # Edge agent communication port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances-core
    pid: host
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
    restart: unless-stopped

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-core
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    environment:
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
    restart: unless-stopped

volumes:
  portainer_data:
