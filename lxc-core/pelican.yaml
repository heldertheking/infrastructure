services:
  panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - database
      - redis
    environment:
      - TZ=${TZ}
      - APP_URL=https://pelican.heldertheking.com
      - APP_ENV=production
      - APP_DEBUG=false
      - BEHIND_PROXY=true
    volumes:
      - ${PATH_APPDATA}/pelican/panel:/pelican-data
    networks:
      - core-mgmt

  database:
    image: mariadb:11
    container_name: pelican-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${PELICAN_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=pelican
      - MYSQL_USER=pelican
      - MYSQL_PASSWORD=${PELICAN_DB_PASSWORD}
    volumes:
      - ${PATH_APPDATA}/pelican/db:/var/lib/mysql
    networks:
      - core-mgmt

  redis:
    image: redis:7-alpine
    container_name: pelican-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - ${PATH_APPDATA}/pelican/redis:/data
    networks:
      - core-mgmt

networks:
  core-mgmt:
    name: core-mgmt-network
    external: true