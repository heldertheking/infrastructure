services:
  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-services
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
      - EVENTS=1
    networks:
      - services-mgmt

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${PATH_APPDATA}/beszel_agent:/var/lib/beszel-agent
      - ${BESZEL_SOCKET}:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      HUB_URL: https://monitoring.heldertheking.com
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}

  glances:
    image: nicolargo/glances:latest
    container_name: glances-services
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}

networks:
  services-mgmt:
    name: services-mgmt-network
    driver: bridge