services:
  portainer-agent:
    image: portainer/agent:2.39.3
    container_name: portainer-agent-services
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${PATH_APPDATA}/services/portainer:/data
    ports:
      - "9001:9001"
    restart: unless-stopped
    networks:
      - services-mgmt

  glances:
    image: nicolargo/glances:latest
    container_name: glances-agent-services
    pid: host # Essential for Glances to see the true processes of the LXC
    environment:
      - GLANCES_OPT=-w # Starts Glances in Web/Server mode
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - services-mgmt

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-services
    privileged: true # Often required for AppArmor/SELinux environments inside LXCs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # STRICTLY Read-Only
    environment:
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - services-mgmt

networks:
  services-mgmt:
    name: services-mgmt-network
    driver: bridge
