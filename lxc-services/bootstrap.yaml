services:
  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-services
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
      - EVENTS=1
    networks:
      - services-mgmt

networks:
  services-mgmt:
    name: services-mgmt-network
    driver: bridge