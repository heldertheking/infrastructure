config:
  security.nesting: "true"
  security.privileged: "true"
  security.syscalls.intercept.mknod: "true"
  security.syscalls.intercept.setxattr: "true"
  linux.kernel_modules: ip_tables,ip6_tables,netlink_diag,nf_nat,overlay,br_netfilter
  raw.lxc: |
    lxc.apparmor.profile=unconfined
description: Docker-capable Incus profile (nesting + required syscall intercepts).
  Per-node appdata/storage bind mounts are NOT here (they'd be identical for every
  instance if defined in the profile) — deploy.sh adds them per-instance instead.
devices:
  eth0:
    name: eth0
    network: incusbr0
    type: nic
  root:
    path: /
    pool: homelab-storage
    type: disk
name: docker