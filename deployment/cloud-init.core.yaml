#cloud-config

hostname: node-core

# Static IP
network:
  version: 1
  config:
    - type: physical
      name: eth0
      subnets:
        - type: static
          address: 10.145.236.10/24
          gateway: 10.145.236.1
          dns_nameservers:
            - 1.1.1.1
            - 8.8.8.8

# System packages
packages:
  - ca-certificates
  - curl
  - gnupg
  - wget
  - git
  - htop

# Fix DNS + compose env
write_files:
  - path: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    permissions: '0644'

  - path: /opt/compose/.env
    content: |
      PATH_APPDATA=/opt/appdata
      PATH_STORAGE=/mnt/storage-hdd
      PATH_LOGS=/var/logs
      TZ=Europe/Zurich
    permissions: '0600'

runcmd:
  - timedatectl set-timezone Europe/Zurich
  - mkdir -p /opt/appdata /opt/compose /mnt/storage-hdd /var/logs

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt update
  - apt install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker

  # Glances runs in Docker on node-core (needs docker socket access)
  # It is managed via bootstrap.yaml

final_message: "node-core ready after $UPTIME seconds"