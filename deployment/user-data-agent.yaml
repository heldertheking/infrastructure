#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - glances

write_files:
  - path: /etc/default/glances
    owner: root:root
    permissions: '0644'
    content: |
      # Run Glances in web-server mode, reachable on port 61208
      GLANCES_OPT="-w --bind 0.0.0.0"

runcmd:
  # --- Docker CE (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Glances native service ---
  - systemctl enable --now glances

  # --- Portainer Agent (single container) ---
  - >
    docker run -d --name portainer_agent --restart=always -p 9001:9001
    -v /var/run/docker.sock:/var/run/docker.sock
    -v /var/lib/docker/volumes:/var/lib/docker/volumes
    -v /:/host
    portainer/agent:latest

final_message: "Agent node ready (Docker + Glances + Portainer Agent) after $UPTIME seconds"
