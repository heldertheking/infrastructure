#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - glances

write_files:
  - path: /etc/default/glances
    owner: root:root
    permissions: '0644'
    content: |
      # Run Glances in web-server mode, reachable on port 61208
      GLANCES_OPT="-w --bind 0.0.0.0"
  - path: /etc/apt/apt.conf.d/99force-ipv4
    owner: root:root
    permissions: '0644'
    content: |
      # Avoid slow AAAA-lookup timeouts on networks with no real IPv6 route
      Acquire::ForceIPv4 "true";

runcmd:
  # --- Docker CE (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # --- Glances native service ---
  - systemctl enable --now glances

final_message: "Node ready (Docker + Glances) after $UPTIME seconds. Portainer, Swarm join/init, and node labeling are handled by deploy.sh after boot, not here."
