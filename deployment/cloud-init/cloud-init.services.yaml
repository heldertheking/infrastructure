#cloud-config

hostname: node-services

# Static IP
network:
  version: 1
  config:
    - type: physical
      name: eth0
      subnets:
        - type: static
          address: 10.145.236.20/24
          gateway: 10.145.236.1
          dns_nameservers:
            - 1.1.1.1
            - 8.8.8.8

# System packages
packages:
  - ca-certificates
  - curl
  - gnupg
  - wget
  - git
  - htop
  - python3-pip

# Fix DNS + compose env
write_files:
  - path: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    permissions: '0644'

  - path: /opt/compose/.env
    content: |
      PATH_APPDATA=/opt/appdata
      PATH_STORAGE=/mnt/storage-hdd
      PATH_LOGS=/var/logs
      TZ=Europe/Zurich
    permissions: '0600'

  - path: /etc/systemd/system/glances.service
    content: |
      [Unit]
      Description=Glances System Monitor
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/glances -w
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

  - path: /etc/systemd/system/portainer-agent.service
    content: |
      [Unit]
      Description=Portainer Agent
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=/bin/sleep 10
      ExecStart=/usr/local/bin/portainer-agent
      Restart=always
      RestartSec=10
      Environment=AGENT_PORT=9001

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

runcmd:
  - timedatectl set-timezone Europe/Zurich
  - mkdir -p /opt/appdata /opt/compose /mnt/storage-hdd /var/logs

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt update
  - apt install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker

  # Install Glances natively
  - pip3 install glances --break-system-packages

  # Install Portainer agent natively
  - mkdir -p /tmp/portainer-extract
  - curl -L https://github.com/portainer/portainer/releases/download/2.39.3/portainer-2.39.3-linux-amd64.tar.gz | tar xz -C /tmp/portainer-extract
  - cp /tmp/portainer-extract/portainer/portainer-agent /usr/local/bin/portainer-agent
  - chmod +x /usr/local/bin/portainer-agent
  - rm -rf /tmp/portainer-extract

  # Enable native services
  - systemctl daemon-reload
  - systemctl enable --now glances
  - systemctl enable --now portainer-agent

final_message: "node-services ready after $UPTIME seconds"