#cloud-config
hostname: games

network:
  version: 2
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - 10.145.236.30/24
      routes:
        - to: default
          via: 10.145.236.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

packages:
  - ca-certificates
  - curl
  - gnupg
  - wget
  - git
  - htop
  - nano
  - python3-pip

# Fix DNS + compose env
write_files:
  - path: /opt/compose/.env
    content: |
      NODE_NAME=games
      PATH_APPDATA="/opt/appdata/${NODE_NAME}"
      PATH_STORAGE="/mnt/storage/${NODE_NAME}"
      PATH_LOGS="/var/logs/${NODE_NAME}"
      TZ=Europe/Zurich
    permissions: '0600'

  - path: /etc/systemd/system/glances.service
    content: |
      [Unit]
      Description=Glances System Monitor
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/glances -w
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

  - path: /opt/compose/docker-compose.yml
    content: |
      services:
        portainer-agent:
          image: portainer/agent:latest
          container_name: portainer-agent
          restart: always
          security_opt:
            - no-new-privileges:true
          environment:
            - TZ=${TZ}
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
          network_mode: host
    permissions: '0644'

runcmd:
  - timedatectl set-timezone Europe/Zurich
  - mkdir -p /mnt/appdata /opt/compose /mnt/storage /var/logs /var/lib/pelican/volumes /tmp/pelican

  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker

  # Install Glances
  - pip3 install glances --break-system-packages

  # Install Portainer Agent
  - cd /opt/compose && docker-compose up -d

  # Enable native services
  - systemctl daemon-reload
  - systemctl enable --now glances

final_message: "node-games ready after $UPTIME seconds"