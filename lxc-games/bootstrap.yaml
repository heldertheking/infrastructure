services:
  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-games
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    environment:
      - TZ=${TZ}
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
      - EVENTS=1
    networks:
      - games-mgmt

  pelican-wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${PATH_APPDATA}/wings:/etc/pelican
      - ${PATH_STORAGE}/servers:/var/lib/pelican/volumes
      - /tmp/pelican:/tmp/pelican
    ports:
      - "8080:8080"
      - "2022:2022"
    networks:
      - games-mgmt

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-games
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - PLAYIT_SECRET=${PLAYIT_SECRET}
    volumes:
      - ${PATH_APPDATA}/playit:/etc/playit
    networks:
      - games-mgmt

networks:
  games-mgmt:
    name: games-mgmt-network
    driver: bridge