services:
  portainer-agent:
    image: portainer/agent:2.39.3
    container_name: portainer-agent-games
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${PATH_APPDATA}/games/portainer:/data
    ports:
      - "9001:9001"
    restart: unless-stopped
    networks:
      - games-mgmt

  glances:
    image: nicolargo/glances:latest
    container_name: glances-agent-games
    pid: host
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
    restart: unless-stopped
    networks:
      - games-mgmt

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-games
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    environment:
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
    restart: unless-stopped
    networks:
      - games-mgmt

  pelican-wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${PATH_APPDATA}/games/wings:/etc/pelican
      - ${PATH_STORAGE}:/srv/daemon-data
      - /tmp/pelican:/tmp/pelican
    ports:
      - "8080:8080"   # Wings API (Pelican Panel communicates here)
      - "2022:2022"   # SFTP
    networks:
      - games-mgmt

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-games
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - PLAYIT_SECRET=${PLAYIT_SECRET}
    volumes:
      - ${PATH_APPDATA}/games/playit:/etc/playit
    networks:
      - games-mgmt


networks:
  games-mgmt:
    name: games-mgmt-network
    driver: bridge