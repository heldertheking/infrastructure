services:
  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-games
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    environment:
      - TZ=${TZ}
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - IMAGES=1
      - EVENTS=1
    networks:
      - games-mgmt

  pelican-wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /etc/pelican:/etc/pelican
      - /var/lib/pelican/volumes:/var/lib/pelican/volumes
      - /tmp/pelican:/tmp/pelican
    ports:
      - "8080:8080"
      - "2022:2022"
    networks:
      - games-mgmt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wings.rule=Host(`node-pelican.heldertheking.com`)"
      - "traefik.http.routers.wings.entrypoints=web"
      - "traefik.http.services.wings.loadbalancer.server.port=8080"

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-games
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - PLAYIT_SECRET=${PLAYIT_SECRET}
    volumes:
      - ${PATH_APPDATA}/playit:/etc/playit
    networks:
      - games-mgmt

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${PATH_APPDATA}/beszel_agent:/var/lib/beszel-agent
      - ${BESZEL_SOCKET}:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      HUB_URL: https://monitoring.heldertheking.com
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}

  glances:
    image: nicolargo/glances:latest
    container_name: glances-games
    restart: unless-stopped
    ports:
      - "61208:61208"
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}
    networks:
      - games-mgmt

networks:
  games-mgmt:
    name: games-mgmt-network
    driver: bridge