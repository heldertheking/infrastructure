services:
  portainer-agent:
    image: portainer/agent:2.39.3
    container_name: portainer-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances-agent
    pid: host # Essential for Glances to see the true processes of the LXC
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w # Starts Glances in Web/Server mode
    restart: unless-stopped

  secure-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    privileged: true # Often required for AppArmor/SELinux environments inside LXCs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # STRICTLY Read-Only
    ports:
      - "2375:2375"
    environment:
      - POST=0          # Blocks all write actions (create, delete, stop, start)
      - CONTAINERS=1    # Allows Homepage/Traefik to list containers
      - NETWORKS=1      # Allows discovery of networks
      - SERVICES=1      # Allows reading stack configurations
      - IMAGES=1        # Allows reading image statuses
    restart: unless-stopped
