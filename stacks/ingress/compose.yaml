services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${PATH_APPDATA}/traefik:/etc/traefik
    environment:
      TZ: ${TZ}
    networks:
      - ingress-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NETWORKS: 1
      VOLUMES: 0
      POSTS: 0
      TZ: ${TZ}
    networks:
      - ingress-net

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
      TZ: ${TZ}
    networks:
      - public-net

networks:
  # Internal network — traefik ↔ docker-proxy only. No internet egress.
  ingress-net:
    name: ingress-net
    driver: bridge
    internal: true
  # Shared bridge all routable services must join.
  # Owned by this stack — other stacks reference it as external: true.
  public-net:
    name: public-net
    driver: bridge
