global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  insecure: true # Dashboard on :8080

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true

providers:
  # Swarm provider: reads deploy.labels from all services across the cluster.
  # Requires SERVICES=1, SWARM=1, TASKS=1 in docker-proxy.
  swarm:
    endpoint: "tcp://docker-proxy:2375"
    exposedByDefault: false
    network: traefik-public # overlay network Traefik uses to reach backends

  # Dynamic file provider for manual route overrides, TLS certs, middlewares, etc.
  file:
    directory: /etc/traefik/dynamic
    watch: true
