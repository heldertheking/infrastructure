services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ${PATH_STORAGE}:/mnt/storage:ro
      - ${PATH_APPDATA}/homepage:/app/config
      - ${PATH_LOGS}/homepage:/app/config/logs
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN}
      PUID: 1000
      PGID: 1000
    networks:
      - monitoring-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${PATH_APPDATA}/uptime-kuma:/app/data
    environment:
      TZ: ${TZ}
      UMASK: "0022"
    healthcheck:
      test: ["CMD", "curl", "-f", "https://hc-ping.com/${HC_PING_UUID}"]
      interval: 10m
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.${DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=web"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
      WATCHTOWER_SCHEDULE: "0 0 5 * * 6"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLL_BACK_ON_FAILURE: "true"
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_URL: "${NOTIFY_URL}"
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
    networks:
      - monitoring-net

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    volumes:
      - ${PATH_APPDATA}/beszel/hub:/beszel_data
    environment:
      TZ: ${TZ}
      APP_URL: https://monitoring.${DOMAIN}
    networks:
      - monitoring-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`monitoring.${DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=web"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

  homelable-backend:
    image: ghcr.io/pouzor/homelable-backend:latest
    container_name: homelable-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SQLITE_PATH: /app/data/homelab.db
      CORS_ORIGINS: '["http://localhost:3000", "https://homelable.${DOMAIN}"]'
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${HOMELABLE_PASS}
    volumes:
      - ${PATH_APPDATA}/homelable/data:/app/data
    networks:
      - monitoring-net
    cap_add:
      - NET_RAW

  homelable-frontend:
    image: ghcr.io/pouzor/homelable-frontend:latest
    container_name: homelable-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      BACKEND_UPSTREAM: "homelable-backend:8000"
    depends_on:
      - homelable-backend
    networks:
      - monitoring-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homelable.rule=Host(`homelable.${DOMAIN}`)"
      - "traefik.http.routers.homelable.entrypoints=web"
      - "traefik.http.services.homelable.loadbalancer.server.port=80"

  homelable-mcp:
    image: ghcr.io/pouzor/homelable-mcp:latest
    container_name: homelable-mcp
    restart: unless-stopped
    ports:
      - "8989:8001"
    environment:
      TZ: ${TZ}
      BACKEND_URL: "http://homelable-backend:8000"
      MCP_API_KEY: ${MCP_API_KEY}
    depends_on:
      - homelable-backend
    networks:
      - monitoring-net

  docker-proxy-monitoring:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-monitoring
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      NETWORKS: 1
      POSTS: 0
      TZ: ${TZ}
    networks:
      - monitoring-net

networks:
  monitoring-net:
    name: monitoring-net
    driver: bridge
  public-net:
    name: public-net
    external: true
