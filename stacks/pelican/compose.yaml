services:
  panel:
    image: ghcr.io/pelican/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/panel:/pelican-data
      - ${PATH_APPDATA}/panel/public:/public
    environment:
      TZ: ${TZ}
      APP_URL: https://pelican.${DOMAIN}
      APP_ENV: production
      APP_DEBUG: "false"
      BEHIND_PROXY: "true"
    networks:
      - pelican-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pelican-panel.rule=Host(`pelican.${DOMAIN}`)"
      - "traefik.http.routers.pelican-panel.entrypoints=web"
      - "traefik.http.services.pelican-panel.loadbalancer.server.port=80"

  database:
    image: mariadb:11
    container_name: pelican-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/db:/var/lib/mysql
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${PELICAN_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: pelican
      MYSQL_USER: pelican
      MYSQL_PASSWORD: ${PELICAN_DB_PASSWORD}
    networks:
      - pelican-net

  redis:
    image: redis:7-alpine
    container_name: pelican-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/redis:/data
    environment:
      TZ: ${TZ}
    networks:
      - pelican-net

  wings:
    image: ghcr.io/pelican/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /etc/pelican:/etc/pelican
      - /var/lib/pelican/volumes:/var/lib/pelican/volumes
      - /tmp/pelican:/tmp/pelican
    environment:
      TZ: ${TZ}
    networks:
      - pelican-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pelican-wings.rule=Host(`wings.${DOMAIN}`)"
      - "traefik.http.routers.pelican-wings.entrypoints=web"
      - "traefik.http.services.pelican-wings.loadbalancer.server.port=8080"

networks:
  pelican-net:
    name: pelican-net
    driver: bridge
  public-net:
    name: public-net
    external: true
