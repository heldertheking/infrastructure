services:
  panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/pelican/panel:/pelican-data
    environment:
      TZ: ${TZ}
      APP_URL: https://pelican.${DOMAIN}
      APP_ENV: production
      APP_DEBUG: "false"
      BEHIND_PROXY: "true"
    networks:
      - pelican-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pelican-panel.rule=Host(`pelican.${DOMAIN}`)"
      - "traefik.http.routers.pelican-panel.entrypoints=web"
      - "traefik.http.services.pelican-panel.loadbalancer.server.port=80"

  database:
    image: mariadb:11
    container_name: pelican-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/pelican/db:/var/lib/mysql
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${PELICAN_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: pelican
      MYSQL_USER: pelican
      MYSQL_PASSWORD: ${PELICAN_DB_PASSWORD}
    networks:
      - pelican-net

  redis:
    image: redis:7-alpine
    container_name: pelican-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PATH_APPDATA}/pelican/redis:/data
    environment:
      TZ: ${TZ}
    networks:
      - pelican-net

  wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ${PATH_APPDATA}/pelican/wings:/etc/pelican
      - /var/lib/pelican/volumes:/var/lib/pelican/volumes
      - /tmp/pelican:/tmp/pelican
    environment:
      TZ: ${TZ}
    networks:
      - pelican-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pelican-wings.rule=Host(`wings.${DOMAIN}`)"
      - "traefik.http.routers.pelican-wings.entrypoints=web"
      - "traefik.http.services.pelican-wings.loadbalancer.server.port=8080"

networks:
  pelican-net:
    name: pelican-net
    driver: bridge
  public-net:
    name: public-net
    external: true
