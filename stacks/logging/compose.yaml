services:
  loki:
    image: grafana/loki:3
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ${PATH_APPDATA}/loki:/loki
    environment:
      TZ: ${TZ}
    networks:
      - logging-net
    ports:
      - "10006:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:3
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./promtail.yaml:/etc/promtail/promtail.yaml:ro
      - ${PATH_LOGS}:/var/log/host:ro
    environment:
      TZ: ${TZ}
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging-net
    ports:
      - "10007:9080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${PATH_APPDATA}/grafana:/var/lib/grafana
    environment:
      TZ: ${TZ}
      GF_SERVER_ROOT_URL: https://analytics.${DOMAIN}
      GF_SERVER_PROTOCOL: http
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging-net
      - public-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`analytics.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  docker-proxy-logging:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy-logging
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      NETWORKS: 1
      POSTS: 0
      TZ: ${TZ}
    networks:
      - logging-net

networks:
  logging-net:
    name: logging-net
    driver: bridge
  public-net:
    name: public-net
    external: true
